name: CI / Build & Test

on:
  push:
    branches: [ main, 'feature/**', oled-ssd1306 ]
  pull_request:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:

# Enforce strict read-only token permissions across all jobs
permissions:
  contents: read

# Cancel in-flight runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Host Unit Tests (ASAN & UBSAN)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Host Unit Tests
        run: |
          make test

  build:
    name: PlatformIO Firmware Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compile Firmware
        run: |
          pio run
